<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calucaltor</title>
    <style>
       h3{
        text-align: center;

       } body{
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: center;
            background: linear-gradient(to bottom,rgb(209, 234, 234),transparent);
        }
        div{
            padding:30px 80px;
            width:50vw;
            height:60vh;
            display: flex;
            flex-direction: column;
        }
        
        .cont{
            background:linear-gradient(to bottom,lightgreen ,transparent,orange);
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 2px 1px 2px 1px;
        }
        button{
            width:10vh;
            border: 2px solid black;
            border-radius: 5px;
            margin: 5px;
        }
        button:hover{
            color:red;
            background-color: #191a19;
        }
        .button{
            display: inline-block;
        }
        input{
            width:10vw;
            outline:1px solid rgb(0, 157, 255);
            border-radius: 5px;
            margin-left: 250px;
            
            
        }
        label{
            margin-left: 250px;
            font-weight: 400
        }
        
    </style>
    <script>
    function cal(){
      var num1 = parseInt(document.getElementById("a").value)
      var num2 = parseInt(document.getElementById("b").value)
      var num3 = parseInt(document.getElementById("c").value)
      var sum = num1+num2+num3
      document.getElementById("Result").value=sum
     }
     function mul(){
      var num1 = parseInt(document.getElementById("a").value)
      var num2 = parseInt(document.getElementById("b").value)
      var num3 = parseInt(document.getElementById("c").value)
      var sum = num1*num2*num3
      document.getElementById("Result").value=sum
     }

     function sub(){
      var num1 = parseInt(document.getElementById("a").value)
      var num2 = parseInt(document.getElementById("b").value)
      var num3 = parseInt(document.getElementById("c").value)
      var sum = num1-num2-num3
      document.getElementById("Result").value=sum
     }
     function mod(){
      var num1 = parseInt(document.getElementById("a").value)
      var num2 = parseInt(document.getElementById("b").value)
      var num3 = parseInt(document.getElementById("c").value)
      var sum = num1%num2%num3
      document.getElementById("Result").value=sum
     }
     function div(){
      var num1 = parseInt(document.getElementById("a").value)
      var num2 = parseInt(document.getElementById("b").value)
      var num3 = parseInt(document.getElementById("c").value)
      var sum = num1/num2/num3
      document.getElementById("Result").value=sum
     }
     function exp(){
      var num1 = parseInt(document.getElementById("a").value)
      var num2 = parseInt(document.getElementById("b").value)
      var num3 = parseInt(document.getElementById("c").value)
      var sum = num1**num2**num3
      document.getElementById("Result").value=sum
     }
    
    </script>
</head>
<body>
    
   <div class="cont"> 
    <h3>MINI CALUCALATOR</h3>
    <label for="">Enter  1st Number:</label>
    <input type="text" placeholder="Enter number here" id="a">
    <br>
    <br>  
    <label for="">Enter 2nd Number:</label>
    <input type="text" placeholder="Enter number here" id="b">
    <br>
    <br>
    <label for="">Enter 3rd Number:</label>
    <input type="text" placeholder="Enter number here" id="c">
    <br>
    <br>
     <label for="">Result :&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
    <input type="text"  id="Result" readonly>
    <br>
    <br>
    <div class="button">
    <button onclick="cal()">ADD</button>
    <button onclick="mul()">MUL</button>
    <button onclick="sub()">SUB</button>
    <button onclick="mod()">Mod</button>
    <button onclick="div()">Div</button>
    <button onclick="exp()">Expo</button>
    </div>
   </div>
    
   
</body>
</html>
